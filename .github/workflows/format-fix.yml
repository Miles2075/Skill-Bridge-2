name: Format SkillBridge

on:
  push:
    branches:
      - fix/reconcile-video-upload

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/reconcile-video-upload

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format changed files
        run: npx prettier --write src/lib/lms-db.server.ts vite.config.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/lms-db.server.ts vite.config.ts
          git commit -m "style: apply prettier formatting"
          git push origin fix/reconcile-video-upload
